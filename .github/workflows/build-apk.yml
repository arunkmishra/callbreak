name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./callbreak-client
        run: flutter pub get

      - name: Create .env file from secrets
        working-directory: ./callbreak-client
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID_ANDROID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID_ANDROID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID_IOS=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID_IOS }}" >> .env

      - name: Build APK
        working-directory: ./callbreak-client
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: callbreak-apk
          path: callbreak-client/build/app/outputs/flutter-apk/app-release.apk
