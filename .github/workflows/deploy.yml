name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'callbreak-client/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./callbreak-client
        run: flutter pub get

      - name: Create .env file from secrets
        working-directory: ./callbreak-client
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID_ANDROID=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID_ANDROID }}" >> .env
          echo "ADMOB_INTERSTITIAL_UNIT_ID_IOS=${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID_IOS }}" >> .env

      - name: Build Web App
        working-directory: ./callbreak-client
        run: flutter build web --release --base-href /callbreak/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./callbreak-client/build/web
